<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a6b">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valen">

<title>Los juegos de Valen</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    background:#1b2a6b;
  }
  #app { width:100%; height:100%; position:relative; }

  /* ---------- MENU ---------- */
  #menu {
    width:100%; height:100%; position:relative;
    background: radial-gradient(circle at 50% 8%, #5a72e0 0%, #2c3f9e 45%, #16225c 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3.5vmin; padding:3vmin;
  }
  /* globos flotando por detrás, bien tenues */
  #fondoMenu { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  #titulo, #grid { position:relative; z-index:1; }

  #titulo {
    font-size:min(8.2vw, 8.5vh); font-weight:900; white-space:nowrap;
    letter-spacing:.02em; line-height:1.1;
    text-shadow:0 .35vmin 0 rgba(0,0,0,.35), 0 1vmin 2vmin rgba(0,0,0,.3);
  }
  #titulo span { display:inline-block; animation:saludar 2.6s ease-in-out infinite; }
  @keyframes saludar { 0%,100%{ transform:translateY(0) rotate(0) } 50%{ transform:translateY(-.7vmin) rotate(-2deg) } }

  #grid {
    display:grid; grid-template-columns:repeat(3, min(30vw, 27vh)); gap:2.2vmin;
    justify-content:center;
  }
  .tarjeta {
    aspect-ratio:1/1;
    border-radius:5.5vmin; border:none; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.4vmin; padding:2vmin; cursor:pointer;
    box-shadow:0 1.4vmin 0 rgba(0,0,0,.32), inset 0 .8vmin 1.6vmin rgba(255,255,255,.45);
    transition:transform .12s ease;
    animation:flotar 3s ease-in-out infinite;
  }
  /* brillo suave en la mitad de arriba */
  .tarjeta::after {
    content:""; position:absolute; left:0; right:0; top:0; height:48%;
    background:linear-gradient(rgba(255,255,255,.32), rgba(255,255,255,0));
    pointer-events:none;
  }
  .tarjeta .dibujo { font-size:min(11vw, 11vh); line-height:1;
                     filter:drop-shadow(0 .5vmin .8vmin rgba(0,0,0,.28)); }
  .tarjeta .nombre { font-size:min(3.2vw, 3vh); font-weight:900; color:#fff;
                     letter-spacing:.03em; text-shadow:0 .3vmin .5vmin rgba(0,0,0,.35); }

  /* De pie: dos columnas y botones bien grandes, que es como lo va a usar */
  @media (orientation: portrait) {
    #grid { grid-template-columns:repeat(2, min(40vw, 19vh)); gap:2.4vmin; }
    .tarjeta .dibujo { font-size:min(14vw, 8.5vh); }
    .tarjeta .nombre { font-size:min(3.8vw, 2.4vh); }
  }
  .tarjeta:active { transform:scale(.92) translateY(.6vmin); }
  .tarjeta:nth-child(1){ background:linear-gradient(160deg,#ff8f8f,#e84747); animation-delay:0s;   animation-duration:3.0s }
  .tarjeta:nth-child(2){ background:linear-gradient(160deg,#ffc06a,#ef8b16); animation-delay:.25s; animation-duration:3.4s }
  .tarjeta:nth-child(3){ background:linear-gradient(160deg,#ffe173,#efb716); animation-delay:.5s;  animation-duration:2.8s }
  .tarjeta:nth-child(4){ background:linear-gradient(160deg,#6ee6ae,#1da96c); animation-delay:.75s; animation-duration:3.6s }
  .tarjeta:nth-child(5){ background:linear-gradient(160deg,#82d9fb,#1c9fd8); animation-delay:1s;   animation-duration:3.1s }
  .tarjeta:nth-child(6){ background:linear-gradient(160deg,#dfa6ff,#a44ce6); animation-delay:1.25s;animation-duration:3.3s }
  .tarjeta:nth-child(7){ background:linear-gradient(160deg,#ffa8c5,#e8447f); animation-delay:1.5s; animation-duration:2.9s }
  .tarjeta:nth-child(8){ background:linear-gradient(160deg,#8fe3d8,#17a89a); animation-delay:1.75s;animation-duration:3.5s }
  @keyframes flotar { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-1.2vmin) } }

  /* ---------- PANTALLA DE JUEGO ---------- */
  #juego { position:absolute; inset:0; display:none; }
  #juego.activo { display:block; }
  #lienzo { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* la capa no debe robarle los toques al canvas: solo sus hijos reciben */
  #capa { position:absolute; inset:0; pointer-events:none; }
  #capa > * { pointer-events:auto; }

  #volver {
    position:absolute; top:2vmin; left:2vmin; z-index:50;
    width:13vmin; height:13vmin; border:none; border-radius:50%;
    background:rgba(255,255,255,.9); color:#1b2a6b;
    font-size:7vmin; line-height:1; cursor:pointer;
    box-shadow:0 .8vmin 0 rgba(0,0,0,.2);
    display:none; align-items:center; justify-content:center;
  }
  #volver.visible { display:flex; }
  #volver:active { transform:scale(.9); }

  /* ---------- GRANJA ---------- */
  /* celdas cuadradas que entren siempre, también con la tablet acostada */
  .tablero {
    position:absolute; inset:0; padding:16vmin 3vmin 3vmin;
    display:grid; gap:2.5vmin; align-content:center; justify-content:center;
    grid-template-columns:repeat(3, min(28vw, 23vh));
  }
  .bicho {
    border:none; border-radius:5vmin; background:rgba(255,255,255,.92);
    display:flex; align-items:center; justify-content:center;
    font-size:13vmin; cursor:pointer; aspect-ratio:1/1;
    box-shadow:0 1vmin 0 rgba(0,0,0,.18);
    transition:transform .15s ease;
  }
  .bicho:active { transform:scale(1.15) rotate(-6deg); }
  .bicho.saltando { animation:saltar .6s ease; }
  @keyframes saltar {
    0%,100%{ transform:scale(1) }
    30%{ transform:scale(1.3) rotate(8deg) }
    60%{ transform:scale(1.1) rotate(-8deg) }
  }

  /* ---------- FAMILIA ---------- */
  .tablero.gente { grid-template-columns:repeat(4, min(21vw, 30vh)); }
  @media (orientation: portrait) {
    .tablero.gente { grid-template-columns:repeat(2, min(40vw, 18vh)); gap:2.4vmin; }
  }
  .persona {
    border:none; border-radius:5vmin; background:rgba(255,255,255,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1vmin; padding:2vmin; cursor:pointer; aspect-ratio:1/1;
    box-shadow:0 1vmin 0 rgba(0,0,0,.18);
    transition:transform .15s ease;
  }
  .persona .cara2 { font-size:min(12vw, 11vh); line-height:1; }
  .persona .quien { font-size:min(3.6vw, 2.4vh); font-weight:900; color:#8a3b57; }
  .persona:active { transform:scale(1.12); }
  .persona.saltando { animation:saltar .6s ease; }

  /* ---------- NÚMEROS ---------- */
  #zonaNum {
    position:absolute; left:0; right:0; top:16vmin; bottom:26vmin; z-index:1;
    display:flex; flex-wrap:wrap; align-content:center; justify-content:center;
    gap:2vmin; padding:2vmin;
  }
  .cosita { font-size:min(19vw, 17vh); line-height:1; animation:aparecer .45s ease; }
  #numGrande {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:min(60vw, 55vh); font-weight:900; color:rgba(255,255,255,.35);
    pointer-events:none; z-index:0; line-height:1;
    text-shadow:0 1vmin 2vmin rgba(0,0,0,.12);
  }
  #numGrande.puesto { animation:aparecer .5s ease; }
  @keyframes aparecer {
    0% { transform:scale(0) rotate(-25deg); opacity:0 }
    70% { transform:scale(1.25) rotate(6deg); opacity:1 }
    100% { transform:scale(1) rotate(0); opacity:1 }
  }
  #filaNum {
    position:absolute; left:0; right:0; bottom:0;
    display:flex; gap:1.5vmin; padding:2vmin;
  }
  .numero {
    flex:1; aspect-ratio:1/1; max-height:20vmin; border:none; border-radius:3.5vmin;
    font-size:min(9vw, 9vh); font-weight:900; color:#fff; cursor:pointer;
    box-shadow:0 1vmin 0 rgba(0,0,0,.25);
    text-shadow:0 .4vmin .6vmin rgba(0,0,0,.3);
  }
  .numero:active { transform:scale(.9); }

  /* ---------- PIANO ---------- */
  #piano { position:absolute; inset:0; display:flex; padding-top:16vmin; }
  .tecla {
    flex:1; border:none; cursor:pointer;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:6vmin; font-size:9vmin;
    transition:filter .08s ease;
  }
  .tecla.tocando { filter:brightness(1.45); }

  /* ---------- PINTAR ---------- */
  #paleta {
    position:absolute; bottom:0; left:0; right:0; z-index:40;
    display:flex; gap:1.5vmin; padding:2vmin;
    background:rgba(0,0,0,.28); backdrop-filter:blur(4px);
  }
  .color {
    flex:1; height:11vmin; border-radius:3vmin; border:.7vmin solid transparent;
    cursor:pointer;
  }
  .color.elegido { border-color:#fff; transform:scale(1.06); }
  #limpiar {
    width:14vmin; height:11vmin; border:none; border-radius:3vmin;
    background:rgba(255,255,255,.9); font-size:6vmin; cursor:pointer;
  }

  /* ---------- MEMOTEST ---------- */
  #memo {
    position:absolute; inset:0; padding:16vmin 3vmin 3vmin;
    display:grid; gap:2.5vmin; align-content:center; justify-content:center;
    grid-template-columns:repeat(3, min(28vw, 32vh));
  }
  .carta {
    aspect-ratio:1/1; border:none; border-radius:5vmin; cursor:pointer;
    background:#ffd23f; font-size:12vmin;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1vmin 0 rgba(0,0,0,.2);
    transition:transform .2s ease, background .2s ease;
  }
  .carta::before { content:"⭐"; position:absolute; opacity:.55; font-size:9vmin; }
  .carta.abierta::before, .carta.lista::before { display:none; }
  .carta .cara { opacity:0; transition:opacity .15s ease; position:relative; }
  .carta.abierta { background:#fff; transform:rotateY(0deg) scale(1.02); }
  .carta.abierta .cara { opacity:1; }
  .carta.lista { background:#3ecf8e; }
  .carta.lista .cara { opacity:1; }

  /* ---------- ATRAPAR ---------- */
  #cesta { position:absolute; z-index:30; font-size:33vmin; pointer-events:none;
           bottom:2vmin; transform:translateX(-50%); transition:none; }
  #sonido {
    position:absolute; top:2vmin; right:2vmin; z-index:50;
    width:13vmin; height:13vmin; border:none; border-radius:50%;
    background:rgba(255,255,255,.9); font-size:6vmin; line-height:1; cursor:pointer;
    box-shadow:0 .8vmin 0 rgba(0,0,0,.2);
    display:none; align-items:center; justify-content:center;
  }
  #sonido.visible { display:flex; }
  #sonido:active { transform:scale(.9); }
  #marcador {
    position:absolute; top:3vmin; right:17vmin; z-index:50;
    font-size:8vmin; color:#fff; font-weight:900;
    text-shadow:0 .5vmin 0 rgba(0,0,0,.3); display:none;
  }
</style>

<body>
<div id="app">

  <div id="menu">
    <canvas id="fondoMenu"></canvas>
    <div id="titulo"></div>
    <div id="grid">
      <button class="tarjeta" data-juego="globos"><span class="dibujo">🎈</span><span class="nombre">Globos</span></button>
      <button class="tarjeta" data-juego="granja"><span class="dibujo">🐮</span><span class="nombre">Animales</span></button>
      <button class="tarjeta" data-juego="piano"><span class="dibujo">🎹</span><span class="nombre">Piano</span></button>
      <button class="tarjeta" data-juego="pintar"><span class="dibujo">🎨</span><span class="nombre">Pintar</span></button>
      <button class="tarjeta" data-juego="memo"><span class="dibujo">🃏</span><span class="nombre">Memoria</span></button>
      <button class="tarjeta" data-juego="atrapar"><span class="dibujo">🧺</span><span class="nombre">Atrapar</span></button>
      <button class="tarjeta" data-juego="familia"><span class="dibujo">👨‍👩‍👦</span><span class="nombre">Familia</span></button>
      <button class="tarjeta" data-juego="numeros"><span class="dibujo">🔢</span><span class="nombre">Números</span></button>
    </div>
  </div>

  <div id="juego">
    <canvas id="lienzo"></canvas>
    <div id="capa"></div>
    <div id="marcador">0</div>
  </div>

  <button id="volver">⬅️</button>
  <button id="sonido">🔊</button>
</div>

<script>
"use strict";

/* ============================================================
   BASE: audio, voz, canvas, ciclo de animación
   ============================================================ */

let ctxAudio = null;
function audio() {
  if (!ctxAudio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctxAudio = new AC();
  }
  if (ctxAudio.state === "suspended") ctxAudio.resume();
  return ctxAudio;
}

/* Todo el sonido pasa por acá: un limitador que impide que se sature y suene
   "a cable en corto" cuando se juntan la música, un efecto y la voz. */
let maestro = null;
function salida() {
  const ac = audio();
  if (!maestro) {
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 12;
    comp.ratio.value = 12;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    const vol = ac.createGain();
    vol.gain.value = 0.85;
    comp.connect(vol).connect(ac.destination);
    maestro = comp;
  }
  return maestro;
}

// Nota simple con envolvente suave (nada estridente para un nene chico)
function nota(frec, dur = 0.35, tipo = "sine", vol = 0.25) {
  const ac = audio();
  const osc = ac.createOscillator();
  const gan = ac.createGain();
  osc.type = tipo;
  osc.frequency.value = frec;
  gan.gain.setValueAtTime(0, ac.currentTime);
  gan.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.02);
  gan.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  osc.connect(gan).connect(salida());
  osc.start();
  osc.stop(ac.currentTime + dur + 0.05);
}

// "Pop" del globo
function pop() {
  const ac = audio();
  const osc = ac.createOscillator();
  const gan = ac.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(700, ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.12);
  gan.gain.setValueAtTime(0.3, ac.currentTime);
  gan.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
  osc.connect(gan).connect(salida());
  osc.start();
  osc.stop(ac.currentTime + 0.2);
}

function fanfarria() {
  [523, 659, 784, 1047].forEach((f, i) =>
    setTimeout(() => nota(f, 0.45, "triangle", 0.22), i * 130)
  );
}

// Grabaciones reales de animales (sonidos/*.mp3, ver CREDITOS.md).
// Se precargan al abrir la granja; si alguna no está, se cae al sonido sintetizado.
const pistas = {};
function precargar(nombres) {
  nombres.forEach(n => {
    if (pistas[n]) return;
    const a = new Audio("sonidos/" + n + ".mp3");
    a.preload = "auto";
    a.addEventListener("error", () => { pistas[n] = null; });
    pistas[n] = a;
  });
}
// Reproduce la grabación y devuelve cuánto dura, en milisegundos (0 si no pudo)
function grabacion(nombre) {
  const base = pistas[nombre];
  if (!base) return 0;
  const s = base.cloneNode();      // clon: se pueden tocar dos animales seguidos
  s.volume = 0.9;
  const p = s.play();
  if (p && p.catch) p.catch(() => {});
  return Math.round((base.duration || 1) * 1000);
}

// Sonido de animal sintetizado: secuencia de tonos que se deslizan.
// Es el respaldo, por si las grabaciones no cargan.
function bicho(pasos, tipo = "sawtooth", vol = 0.18) {
  const ac = audio();
  let t = ac.currentTime;
  pasos.forEach(p => {
    const osc = ac.createOscillator();
    const gan = ac.createGain();
    const filtro = ac.createBiquadFilter();
    filtro.type = "lowpass";
    filtro.frequency.value = 1800;
    osc.type = tipo;
    osc.frequency.setValueAtTime(p[0], t);
    osc.frequency.linearRampToValueAtTime(p[1], t + p[2]);
    gan.gain.setValueAtTime(0, t);
    gan.gain.linearRampToValueAtTime(vol, t + 0.04);
    gan.gain.setValueAtTime(vol, t + p[2] * 0.7);
    gan.gain.exponentialRampToValueAtTime(0.001, t + p[2]);
    osc.connect(filtro).connect(gan).connect(salida());
    osc.start(t);
    osc.stop(t + p[2] + 0.05);
    t += p[2] + (p[3] || 0.05);
  });
}

/* ---------- MÚSICA DE FONDO ----------
   Melodías en escala pentatónica (nunca suenan desafinadas) con timbre de
   cajita de música. Se generan al vuelo: no hay archivos ni loops que corten.
   Solo en los juegos donde el sonido no es el juego (la granja y el piano van
   en silencio). Se apaga con el botón de arriba y la elección queda guardada. */
const NOTAS = { C4:261.63, D4:293.66, E4:329.63, G4:392.00, A4:440.00,
                C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880.00,
                C3:130.81, G3:196.00, A3:220.00 };
const _ = null;
const MELODIAS = {
  menu:    { paso:0.30, vol:0.07,
             notas:["C5","G4","A4","C5","E5","D5","C5","A4","G4","A4","C5","D5","E5","G5","E5","C5"],
             bajo:["C3","A3","G3","C3"] },
  globos:  { paso:0.28, vol:0.075,
             notas:["C5","E5","G5","E5","D5","G5","A5","G5","E5","C5","D5","E5","G5","E5","D5","C5"],
             bajo:["C3","G3","A3","G3"] },
  pintar:  { paso:0.44, vol:0.065,
             notas:["C5",_,"E5",_,"G5",_,"E5",_,"A4",_,"C5",_,"G4",_,_,_],
             bajo:["C3","A3","G3","C3"] },
  memo:    { paso:0.36, vol:0.07,
             notas:["E5","G5",_,"D5","C5",_,"E5",_,"G5","A5",_,"E5","D5",_,"C5",_],
             bajo:["C3","G3","A3","G3"] },
  numeros: { paso:0.5, vol:0.042,
             notas:["C5",_,_,"G4",_,_,"A4",_,_,"C5",_,_,"E5",_,_,_],
             bajo:["C3","G3","A3","C3"] },
  atrapar: { paso:0.26, vol:0.07,
             notas:["C5","C5","E5","G5","A5","G5","E5","D5","C5","E5","D5","C5","A4","C5","D5","E5"],
             bajo:["C3","C3","G3","A3"] }
};

const musica = (function () {
  let reloj = null, proxima = 0, paso = 0, actual = null;
  let apagada = false;
  try { apagada = localStorage.getItem("valen-musica") === "no"; } catch (e) {}

  // Una nota de cajita: fundamental suave + un armónico que se apaga antes
  function campana(frec, cuando, dur, vol) {
    const ac = audio();
    [[1, vol], [2, vol * 0.28]].forEach(([mult, v]) => {
      const osc = ac.createOscillator(), gan = ac.createGain();
      osc.type = "sine";
      osc.frequency.value = frec * mult;
      gan.gain.setValueAtTime(0, cuando);
      gan.gain.linearRampToValueAtTime(v, cuando + 0.015);
      gan.gain.exponentialRampToValueAtTime(0.0001, cuando + dur / mult);
      osc.connect(gan).connect(salida());
      osc.start(cuando);
      osc.stop(cuando + dur + 0.1);
    });
  }

  // Programa por adelantado: así no se entrecorta si el navegador se distrae
  function agendar() {
    if (!actual) return;
    const ac = audio();
    while (proxima < ac.currentTime + 0.4) {
      if (proxima < ac.currentTime) proxima = ac.currentTime + 0.05;
      const n = actual.notas[paso % actual.notas.length];
      if (n) campana(NOTAS[n], proxima, actual.paso * 2.4, actual.vol);
      if (paso % 4 === 0) {
        const b = actual.bajo[Math.floor(paso / 4) % actual.bajo.length];
        campana(NOTAS[b], proxima, actual.paso * 5, actual.vol * 0.5);
      }
      proxima += actual.paso;
      paso++;
    }
  }

  return {
    arrancar(nombre) {
      clearInterval(reloj); reloj = null;
      actual = MELODIAS[nombre] || null;
      if (!actual || apagada) return;
      paso = 0;
      proxima = audio().currentTime + 0.15;
      agendar();
      reloj = setInterval(agendar, 120);
    },
    parar() { clearInterval(reloj); reloj = null; actual = null; },
    get apagada() { return apagada; },
    alternar() {
      apagada = !apagada;
      try { localStorage.setItem("valen-musica", apagada ? "no" : "si"); } catch (e) {}
      if (apagada) { clearInterval(reloj); reloj = null; }
      else if (actual) { paso = 0; proxima = audio().currentTime + 0.1; agendar(); reloj = setInterval(agendar, 120); }
      return apagada;
    }
  };
})();

// Voz en español. Solo habla si el dispositivo tiene una voz española:
// con la voz por defecto pronunciaría todo en inglés.
let vozEs = null;
function elegirVoz() {
  if (!("speechSynthesis" in window)) return null;
  const voces = speechSynthesis.getVoices();
  if (!voces.length) return null;
  vozEs = voces.find(v => /es[-_]AR/i.test(v.lang))
       || voces.find(v => /es[-_](MX|US|419|CO|CL|PE)/i.test(v.lang))
       || voces.find(v => /^es/i.test(v.lang))
       || null;
  return vozEs;
}
if ("speechSynthesis" in window) {
  elegirVoz();
  speechSynthesis.addEventListener("voiceschanged", elegirVoz);
}
function decir(texto) {
  if (!("speechSynthesis" in window)) return;
  if (!vozEs) elegirVoz();          // la lista de voces llega tarde en Android
  if (!vozEs) return;               // sin voz española, mejor callado que en inglés
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.voice = vozEs;
  u.lang = vozEs.lang;
  u.rate = 0.85;
  u.pitch = 1.25;
  speechSynthesis.speak(u);
}

const lienzo = document.getElementById("lienzo");
const cv = lienzo.getContext("2d");
const capa = document.getElementById("capa");
const pantallaJuego = document.getElementById("juego");

const btnSonido = document.getElementById("sonido");
const marcador = document.getElementById("marcador");

let A = 0, H = 0, dpr = 1;
function medir() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  A = lienzo.clientWidth;
  H = lienzo.clientHeight;
  lienzo.width = A * dpr;
  lienzo.height = H * dpr;
  cv.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", () => { medir(); if (juegoActual && juegoActual.medir) juegoActual.medir(); });

let juegoActual = null;
let juegoNombre = null;
let cuadro = 0;

function ciclo() {
  cuadro = requestAnimationFrame(ciclo);
  // si cambió el tamaño (rotó la tablet, se mostró recién la pantalla) reajusta
  if (lienzo.clientWidth !== A || lienzo.clientHeight !== H) {
    medir();
    if (juegoActual && juegoActual.medir) juegoActual.medir();
  }
  if (juegoActual && juegoActual.dibujar) juegoActual.dibujar();
}

function abrir(nombre) {
  cerrar();
  menu.style.display = "none";
  if (window.fondoMenuAndando) window.fondoMenuAndando.apagar();
  history.pushState({ juego: nombre }, "");
  pantallaJuego.classList.add("activo");
  btnVolver.classList.add("visible");
  medir(); // recién ahora el canvas tiene tamaño real
  juegoNombre = nombre;
  juegoActual = JUEGOS[nombre]();
  if (juegoActual.dibujar) ciclo();
  audio();
  musica.arrancar(nombre);
  btnSonido.textContent = musica.apagada ? "🔇" : "🔊";
  btnSonido.classList.toggle("visible", !!MELODIAS[nombre]);
}

function cerrar(alMenu) {
  musica.parar();
  if (alMenu) musica.arrancar("menu");
  btnSonido.classList.toggle("visible", !!alMenu);
  cancelAnimationFrame(cuadro);
  if (juegoActual && juegoActual.salir) juegoActual.salir();
  juegoActual = null;
  juegoNombre = null;
  capa.innerHTML = "";
  pantallaJuego.style.background = "";
  marcador.style.display = "none";
  cv.clearRect(0, 0, A, H);
  pantallaJuego.classList.remove("activo");
  btnVolver.classList.remove("visible");
  menu.style.display = "flex";
  if (window.fondoMenuAndando) window.fondoMenuAndando.prender();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

// Coordenadas de un toque/click relativas al canvas
function punto(ev) {
  const r = lienzo.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

/* ============================================================
   PARTÍCULAS (confeti / explosión), compartidas
   ============================================================ */
let particulas = [];
function estallar(x, y, color, cantidad = 22) {
  for (let i = 0; i < cantidad; i++) {
    const ang = Math.random() * Math.PI * 2;
    const vel = 2 + Math.random() * 6;
    particulas.push({
      x, y,
      vx: Math.cos(ang) * vel,
      vy: Math.sin(ang) * vel - 2,
      r: 3 + Math.random() * 7,
      vida: 1,
      color
    });
  }
}
function pintarParticulas() {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vida -= 0.02;
    if (p.vida <= 0) { particulas.splice(i, 1); continue; }
    cv.globalAlpha = Math.max(p.vida, 0);
    cv.fillStyle = p.color;
    cv.beginPath();
    cv.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    cv.fill();
  }
  cv.globalAlpha = 1;
}

const COLORES = ["#ff6b6b", "#ffa43b", "#ffd23f", "#3ecf8e", "#4fc3f7", "#c77dff", "#ff8fab"];
const alAzar = arr => arr[Math.floor(Math.random() * arr.length)];

/* ============================================================
   JUEGOS
   ============================================================ */
const JUEGOS = {};

/* --- 1. GLOBOS: suben globos, los toca y explotan --- */
JUEGOS.globos = function () {
  const globos = [];
  let proximo = 0;

  function nuevoGlobo() {
    const r = Math.max(A, H) * 0.075;
    globos.push({
      x: r + Math.random() * (A - r * 2),
      y: H + r,
      r,
      vel: 0.9 + Math.random() * 1.1,
      bamboleo: Math.random() * Math.PI * 2,
      color: alAzar(COLORES)
    });
  }

  function tocar(ev) {
    ev.preventDefault();
    const p = punto(ev);
    for (let i = globos.length - 1; i >= 0; i--) {
      const g = globos[i];
      if (Math.hypot(g.x - p.x, g.y - p.y) < g.r * 1.25) {
        estallar(g.x, g.y, g.color, 26);
        globos.splice(i, 1);
        pop();
        return;
      }
    }
  }
  lienzo.addEventListener("touchstart", tocar, { passive: false });
  lienzo.addEventListener("mousedown", tocar);

  return {
    dibujar() {
      cv.fillStyle = "#8fd3ff";
      cv.fillRect(0, 0, A, H);
      // pasto
      cv.fillStyle = "#5fc46b";
      cv.fillRect(0, H - H * 0.1, A, H * 0.1);
      // sol
      cv.fillStyle = "#ffe066";
      cv.beginPath(); cv.arc(A * 0.88, H * 0.12, Math.min(A, H) * 0.09, 0, Math.PI * 2); cv.fill();

      if (--proximo <= 0) { nuevoGlobo(); proximo = 45 + Math.random() * 45; }

      for (let i = globos.length - 1; i >= 0; i--) {
        const g = globos[i];
        g.y -= g.vel;
        g.bamboleo += 0.03;
        const x = g.x + Math.sin(g.bamboleo) * 12;
        if (g.y + g.r < -20) { globos.splice(i, 1); continue; }
        // hilo
        cv.strokeStyle = "rgba(255,255,255,.7)";
        cv.lineWidth = 2;
        cv.beginPath();
        cv.moveTo(x, g.y + g.r);
        cv.quadraticCurveTo(x + 10, g.y + g.r * 1.6, x, g.y + g.r * 2.1);
        cv.stroke();
        // cuerpo
        cv.fillStyle = g.color;
        cv.beginPath();
        cv.ellipse(x, g.y, g.r * 0.85, g.r, 0, 0, Math.PI * 2);
        cv.fill();
        // brillo
        cv.fillStyle = "rgba(255,255,255,.45)";
        cv.beginPath();
        cv.ellipse(x - g.r * 0.3, g.y - g.r * 0.35, g.r * 0.18, g.r * 0.26, -0.4, 0, Math.PI * 2);
        cv.fill();
      }
      pintarParticulas();
    },
    salir() {
      lienzo.removeEventListener("touchstart", tocar);
      lienzo.removeEventListener("mousedown", tocar);
      particulas = [];
    }
  };
};

/* --- 4. PINTAR: dibuja con el dedo --- */
JUEGOS.pintar = function () {
  cv.fillStyle = "#fffdf5";
  cv.fillRect(0, 0, A, H);

  let color = "#ff6b6b";
  let pintando = false;
  let ult = null;

  const paleta = document.createElement("div");
  paleta.id = "paleta";
  COLORES.concat(["#333333"]).forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "color" + (i === 0 ? " elegido" : "");
    b.style.background = c;
    b.addEventListener("click", () => {
      color = c;
      paleta.querySelectorAll(".color").forEach(x => x.classList.remove("elegido"));
      b.classList.add("elegido");
      nota(700, 0.12, "sine", 0.15);
    });
    paleta.appendChild(b);
  });
  const limpiar = document.createElement("button");
  limpiar.id = "limpiar";
  limpiar.textContent = "🧽";
  limpiar.addEventListener("click", () => {
    cv.fillStyle = "#fffdf5";
    cv.fillRect(0, 0, A, H);
    nota(300, 0.3, "sine", 0.18);
  });
  paleta.appendChild(limpiar);
  capa.appendChild(paleta);

  const grosor = Math.max(A, H) * 0.022;

  function empezar(ev) { ev.preventDefault(); pintando = true; ult = punto(ev); trazar(ev); }
  function trazar(ev) {
    if (!pintando) return;
    ev.preventDefault();
    const p = punto(ev);
    cv.strokeStyle = color;
    cv.lineWidth = grosor;
    cv.lineCap = "round";
    cv.lineJoin = "round";
    cv.beginPath();
    cv.moveTo(ult.x, ult.y);
    cv.lineTo(p.x, p.y);
    cv.stroke();
    ult = p;
  }
  function terminar() { pintando = false; }

  lienzo.addEventListener("touchstart", empezar, { passive: false });
  lienzo.addEventListener("touchmove", trazar, { passive: false });
  lienzo.addEventListener("touchend", terminar);
  lienzo.addEventListener("mousedown", empezar);
  lienzo.addEventListener("mousemove", trazar);
  window.addEventListener("mouseup", terminar);

  return {
    // sin dibujar(): el trazo queda fijo en el canvas
    medir() { cv.fillStyle = "#fffdf5"; cv.fillRect(0, 0, A, H); },
    salir() {
      lienzo.removeEventListener("touchstart", empezar);
      lienzo.removeEventListener("touchmove", trazar);
      lienzo.removeEventListener("touchend", terminar);
      lienzo.removeEventListener("mousedown", empezar);
      lienzo.removeEventListener("mousemove", trazar);
      window.removeEventListener("mouseup", terminar);
    }
  };
};

/* --- 6. ATRAPAR: mueve la cesta con el dedo y junta frutas --- */
JUEGOS.atrapar = function () {
  const cosas = [];
  const frutas = ["🍎", "🍌", "🍓", "🍇", "🍊", "🍐", "🍉", "⭐"];
  let cestaX = A / 2;
  let proximo = 0;
  let puntos = 0;

  pantallaJuego.style.background = "linear-gradient(#ffd6e0, #c2f0ff)";
  marcador.style.display = "block";
  marcador.textContent = "0";

  const cesta = document.createElement("div");
  cesta.id = "cesta";
  cesta.textContent = "🧺";
  cesta.style.left = cestaX + "px";
  capa.appendChild(cesta);

  function mover(ev) {
    ev.preventDefault();
    const p = punto(ev);
    cestaX = Math.max(A * 0.08, Math.min(A * 0.92, p.x));
    cesta.style.left = cestaX + "px";
  }
  lienzo.addEventListener("touchstart", mover, { passive: false });
  lienzo.addEventListener("touchmove", mover, { passive: false });
  lienzo.addEventListener("mousemove", mover);
  lienzo.addEventListener("mousedown", mover);

  return {
    dibujar() {
      cv.clearRect(0, 0, A, H);
      const tam = Math.min(A, H) * 0.24; // se recalcula por si rotó la pantalla

      if (--proximo <= 0) {
        cosas.push({
          x: tam + Math.random() * (A - tam * 2),
          y: -tam,
          v: 1.1 + Math.random() * 0.5,   // bien lentas: hay tiempo de sobra para llegar
          giro: (Math.random() - 0.5) * 0.06,
          ang: 0,
          e: alAzar(frutas)
        });
        proximo = 170 + Math.random() * 110;  // y de a una por vez, sin amontonarse
      }

      const pisoY = H - Math.min(A, H) * 0.27;

      cv.font = tam + "px serif";
      cv.textAlign = "center";
      cv.textBaseline = "middle";

      for (let i = cosas.length - 1; i >= 0; i--) {
        const c = cosas[i];
        c.y += c.v;
        c.ang += c.giro;

        // ¿la atrapó?
        if (c.y > pisoY && Math.abs(c.x - cestaX) < Math.min(A, H) * 0.22) {
          estallar(c.x, c.y, alAzar(COLORES), 18);
          cosas.splice(i, 1);
          puntos++;
          marcador.textContent = puntos;
          nota(500 + Math.min(puntos, 12) * 40, 0.25, "triangle", 0.2);
          if (puntos % 3 === 0) { fanfarria(); decir("¡Muy bien Valen!"); }
          continue;
        }
        // se cayó: rebota y desaparece, sin penalización
        if (c.y > H + tam) { cosas.splice(i, 1); continue; }

        cv.save();
        cv.translate(c.x, c.y);
        cv.rotate(c.ang);
        cv.fillText(c.e, 0, 0);
        cv.restore();
      }
      pintarParticulas();
    },
    medir() { cestaX = A / 2; cesta.style.left = cestaX + "px"; },
    salir() {
      lienzo.removeEventListener("touchstart", mover);
      lienzo.removeEventListener("touchmove", mover);
      lienzo.removeEventListener("mousemove", mover);
      lienzo.removeEventListener("mousedown", mover);
      pantallaJuego.style.background = "";
      particulas = [];
    }
  };
};

      decir(g.n);
      const r = btn.getBoundingClientRect();
      estallar(r.left + r.width / 2, r.top + r.height / 2, alAzar(COLORES), 16);
    });
    tablero.appendChild(btn);
  });
  capa.appendChild(tablero);

  return {
    dibujar() { cv.clearRect(0, 0, A, H); pintarParticulas(); },
    salir() { pantallaJuego.style.background = ""; particulas = []; }
  };
};

/* --- 8. NÚMEROS: toca un número y aparecen esas cosas mientras la voz cuenta --- */
JUEGOS.numeros = function () {
  const PALABRAS = ["uno", "dos", "tres", "cuatro", "cinco"];
  let relojes = [];

  pantallaJuego.style.background = "linear-gradient(#c2e9fb, #74a9f7)";

  const zona = document.createElement("div");
  zona.id = "zonaNum";
  const grande = document.createElement("div");   // la cifra, grandota, detrás de los globos
  grande.id = "numGrande";
  const fila = document.createElement("div");
  fila.id = "filaNum";

  PALABRAS.forEach((palabra, i) => {
    const cuantos = i + 1;
    const b = document.createElement("button");
    b.className = "numero";
    b.textContent = cuantos;
    b.style.background = COLORES[i];
    b.addEventListener("click", () => {
      relojes.forEach(clearTimeout);          // si toca otro número, empieza de nuevo
      relojes = [];
      zona.innerHTML = "";
      if ("speechSynthesis" in window) speechSynthesis.cancel();

      grande.textContent = cuantos;         // la cifra aparece grande atrás
      grande.classList.remove("puesto");
      void grande.offsetWidth;
      grande.classList.add("puesto");
      nota(660, 0.25, "sine", 0.2);
      decir(palabra);                       // y la voz dice qué número es

      for (let k = 1; k <= cuantos; k++) {
        relojes.push(setTimeout(() => {
          const sp = document.createElement("span");
          sp.className = "cosita";
          sp.textContent = "🎈";            // siempre globos: la cifra es lo que cambia
          zona.appendChild(sp);
          nota(392 + k * 70, 0.3, "triangle", 0.2);   // cada una más aguda
          decir(PALABRAS[k - 1]);                      // uno, dos, tres...
          if (k === cuantos) {
            relojes.push(setTimeout(() => {
              fanfarria();
              decir("¡" + palabra + " globos!");      // y cierra diciendo cuántos son
              const r = zona.getBoundingClientRect();
              for (let j = 0; j < 3; j++) {           // un chispazo corto, sin taparlos
                estallar(r.left + r.width * (0.25 + j * 0.25), r.top + r.height * 0.5,
                         alAzar(COLORES), 8);
              }
            }, 700));
          }
        }, 800 + (k - 1) * 850));
      }
    });
    fila.appendChild(b);
  });

  capa.appendChild(grande);
  capa.appendChild(zona);
  capa.appendChild(fila);

  return {
    dibujar() { cv.clearRect(0, 0, A, H); pintarParticulas(); },
    salir() {
      relojes.forEach(clearTimeout);
      pantallaJuego.style.background = "";
      particulas = [];
    }
  };
};

/* ---------- PORTADA ----------
   Título con cada letra de un color y globos flotando por detrás. */
(function portada() {
  const texto = "Los juegos de Valen";
  const t = document.getElementById("titulo");
  [...texto].forEach((letra, i) => {
    const sp = document.createElement("span");
    sp.textContent = letra === " " ? " " : letra;
    sp.style.color = COLORES[i % COLORES.length];
    sp.style.animationDelay = (i * 0.07) + "s";
    t.appendChild(sp);
  });

  const fondo = document.getElementById("fondoMenu");
  const fc = fondo.getContext("2d");
  let globos = [], anim = 0, fa = 0, fh = 0;

  function medirFondo() {
    fa = fondo.clientWidth; fh = fondo.clientHeight;
    fondo.width = fa * dpr; fondo.height = fh * dpr;
    fc.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function pintar() {
    anim = requestAnimationFrame(pintar);
    if (fondo.clientWidth !== fa || fondo.clientHeight !== fh) medirFondo();
    fc.clearRect(0, 0, fa, fh);
    if (globos.length < 7 && Math.random() < 0.02) {
      const r = Math.min(fa, fh) * (0.05 + Math.random() * 0.045);
      globos.push({ x: r + Math.random() * (fa - r * 2), y: fh + r, r,
                    vel: 0.25 + Math.random() * 0.35, vaiven: Math.random() * 6.3,
                    color: alAzar(COLORES) });
    }
    for (let i = globos.length - 1; i >= 0; i--) {
      const g = globos[i];
      g.y -= g.vel; g.vaiven += 0.012;
      if (g.y + g.r < -10) { globos.splice(i, 1); continue; }
      const x = g.x + Math.sin(g.vaiven) * 14;
      fc.globalAlpha = 0.28;
      fc.fillStyle = g.color;
      fc.beginPath();
      fc.ellipse(x, g.y, g.r * 0.85, g.r, 0, 0, Math.PI * 2);
      fc.fill();
      fc.globalAlpha = 0.22;                       // el brillito que lo hace globo
      fc.fillStyle = "#fff";
      fc.beginPath();
      fc.ellipse(x - g.r * 0.3, g.y - g.r * 0.35, g.r * 0.16, g.r * 0.24, -0.4, 0, Math.PI * 2);
      fc.fill();
      fc.globalAlpha = 0.1;
      fc.strokeStyle = "#fff"; fc.lineWidth = 2;
      fc.beginPath(); fc.moveTo(x, g.y + g.r); fc.lineTo(x, g.y + g.r * 1.9); fc.stroke();
    }
    fc.globalAlpha = 1;
  }

  window.fondoMenuAndando = {
    prender() { if (!anim) { medirFondo(); pintar(); } },
    apagar() { cancelAnimationFrame(anim); anim = 0; fc.clearRect(0, 0, fa, fh); }
  };
  medirFondo();
  pintar();
})();

medir();

/* Si el celular se bloquea, se cambia de app o de usuario, la música tiene que
   callarse: si no, se sigue escuchando con la app tapada. Al volver, retoma. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    musica.parar();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (ctxAudio && ctxAudio.state === "running") ctxAudio.suspend();
  } else {
    if (ctxAudio && ctxAudio.state === "suspended") ctxAudio.resume();
    musica.arrancar(juegoNombre || "menu");
  }
});
window.addEventListener("pagehide", () => {
  musica.parar();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (ctxAudio && ctxAudio.state === "running") ctxAudio.suspend();
});

// El navegador no deja sonar nada hasta que el dedo toca la pantalla:
// el primer toque en el menú (fuera de una tarjeta) enciende la música.
document.addEventListener("pointerdown", function arranque(ev) {
  if (ev.target.closest(".tarjeta")) return;
  document.removeEventListener("pointerdown", arranque);
  // pantalla completa: menos superficie para que el nene se salga sin querer
  if (matchMedia("(pointer: coarse)").matches && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  if (menu.style.display !== "none") {
    musica.arrancar("menu");
    btnSonido.textContent = musica.apagada ? "🔇" : "🔊";
    btnSonido.classList.add("visible");
  }
});

// Con esto el celular la ofrece como app y sigue andando sin internet
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// Link directo a un juego: .../#granja abre la granja sin pasar por el menú
if (JUEGOS[location.hash.slice(1)]) abrir(location.hash.slice(1));

// Evita el zoom por doble toque y el scroll de rebote
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
